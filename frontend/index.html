<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MUSE PI</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Instrument+Sans:wght@400;500;600&family=Noto+Serif+SC:wght@300;400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles/main.css?v=20260612-pi-auth-title-v1">
</head>
<body>

<div class="topbar">
  <div class="logo">MUSE <span>PI</span></div>
  <div class="tabs">
    <button class="tab-btn" data-tab="projects">项目</button>
    <button class="tab-btn active" data-tab="chat">对话</button>
    <button class="tab-btn" data-tab="agent">Agent</button>
    <button class="tab-btn" data-tab="config">配置</button>
  </div>
  <div class="topbar-right">
    <span class="project-badge" id="projectBadge">对话无需项目</span>
    <span class="model-badge empty" id="modelBadge">未配置</span>
  </div>
</div>

<div class="view" id="projectsView">
  <div class="projects-layout">
    <div class="projects-sidebar">
      <div class="projects-header">
        <h2>Agent <em>项目</em></h2>
        <p>为 Pi Agent 指定本地项目文件夹，项目内的会话和任务记录会按目录分开。</p>
      </div>
      <div class="projects-toolbar">
        <button class="btn btn-primary" id="btnCreateProject">新建项目</button>
        <button class="btn btn-secondary" id="btnOpenProjectChat">进入 Agent</button>
      </div>
    </div>
    <div class="project-grid" id="projectGrid"></div>
  </div>
</div>

<div class="view active" id="chatView">
  <div class="chat-layout">
    <button class="sidebar-toggle" id="sidebarToggle" type="button" title="隐藏会话窗格" aria-label="隐藏会话窗格">
      <span></span>
    </button>
    <div class="sidebar" id="sidebar">
      <div class="project-switcher" id="projectSwitcher">
        <label>当前项目</label>
        <div class="project-select-row">
          <div class="custom-select" id="projectSelect">
            <button class="custom-select-trigger" id="projectSelectTrigger">选择项目</button>
            <ul class="custom-select-dropdown" id="projectSelectDropdown"></ul>
          </div>
          <button id="btnNewProject" title="新建项目">+</button>
        </div>
      </div>
      <div class="sidebar-header">
        <button class="btn-new" id="btnNewSession">+ 新建对话</button>
        <button id="btnClearAll">全部清空</button>
      </div>
      <div class="session-list" id="sessionList"></div>
    </div>
    <div class="chat-main">
      <div class="messages" id="messages"></div>
      <div class="input-area" id="inputArea" style="display:none">
        <div class="runbar">
          <div class="runbar-context">
            <span id="activeProjectHint"></span>
            <span class="branch-pill hidden" id="agentBranchBadge"></span>
          </div>
          <div class="agent-model-picker" id="agentModelPicker">
            <button class="agent-model-trigger" id="agentModelTrigger" type="button" title="选择 Pi Agent 模型">
              <span class="agent-model-dot"></span>
              <span id="agentModelLabel">default</span>
            </button>
            <div class="agent-model-menu" id="agentModelMenu"></div>
          </div>
        </div>
        <div class="reference-picker hidden" id="referencePicker" role="listbox" aria-label="引用候选"></div>
        <div class="input-row">
          <div id="input" contenteditable="true" role="textbox" aria-multiline="true" data-placeholder="输入消息..."></div>
          <button class="send-btn" id="sendBtn" title="发送"></button>
        </div>
        <div class="input-hint">Enter 发送 · Shift+Enter 换行</div>
      </div>
    </div>
    <nav class="round-nav" id="roundNav" aria-label="对话轮次导航">
      <div class="round-nav-container">
        <div class="round-nav-list" id="roundNavList"></div>
      </div>
    </nav>
  </div>
</div>

<div class="view" id="configView">
  <div class="config-container">
    <div class="config-header">
      <h2 id="configHeaderTitle">对话 <em>配置</em></h2>
      <p id="configHeaderText">配置用于普通对话的 API 模型</p>
    </div>
    <div class="card">
      <div class="config-scope-tabs">
        <button class="config-scope-btn active" data-scope="chat">对话模型</button>
        <button class="config-scope-btn" data-scope="agent">Agent 模型</button>
        <button class="config-scope-btn" data-scope="backgrounds">背景图片</button>
      </div>
      <div class="config-model-panel" id="configModelPanel">
        <div class="presets" id="presets"></div>
        <div class="field">
          <label id="apiUrlLabel">API 地址 <span class="hint">&mdash; OpenAI 兼容格式</span></label>
          <input type="text" id="apiUrl" placeholder="https://api.openai.com/v1/chat/completions" spellcheck="false">
          <div class="cli-path-status" id="piCliPathStatus"></div>
        </div>
        <div class="field">
          <label id="apiKeyLabel">API Key</label>
          <div class="input-wrap">
            <input type="password" id="apiKey" placeholder="sk-..." spellcheck="false" autocomplete="off">
            <button class="toggle-vis" id="toggleKey" title="Show / hide">&#9675;</button>
          </div>
        </div>
        <div class="field">
          <label id="modelNameLabel">启用模型</label>
          <input type="hidden" id="modelName">
          <div class="model-options" id="modelOptions"></div>
        </div>
        <div class="pi-auth-panel hidden" id="piAuthPanel"></div>
      </div>
      <div class="background-config-panel hidden" id="backgroundConfigPanel"></div>
      <div class="actions">
        <button class="btn btn-primary" id="saveBtn">保存配置</button>
        <button class="btn btn-secondary" id="clearBtn">清除</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)']],
    displayMath: [['$$', '$$'], ['\\[', '\\]']],
    processEscapes: true
  },
  options: {
    skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code']
  }
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/dompurify/dist/purify.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<script defer src="scripts/app.js?v=20260612-pi-auth-title-v1"></script>
</body>
</html>
